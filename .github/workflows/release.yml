name: Release

on:
  push:
    tags: ["v*"]

# The release job uploads an asset to the repo, which needs write access.
permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  release:
    name: build wasm and publish release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        run: rustup target add wasm32-wasip1

      - uses: Swatinem/rust-cache@v2

      - run: cargo build --release --target wasm32-wasip1

      # Same guard as CI: a cdylib-only build loads in nothing, and shipping one
      # as a release asset would be worse than shipping none at all.
      - name: Verify the wasm exports Zellij needs
        run: |
          sudo apt-get update && sudo apt-get install -y wabt
          exports=$(wasm-objdump -x target/wasm32-wasip1/release/zj-agent-mob.wasm)
          for sym in _start load update render pipe plugin_version; do
            printf '%s' "$exports" | grep -q "<$sym> -> \"$sym\"" \
              || { echo "::error::wasm is missing the $sym export"; exit 1; }
          done
          echo "all required exports present"

      # The tag is the source of truth for the version; a mismatch with
      # Cargo.toml means one of the two was forgotten.
      - name: Check the tag matches Cargo.toml
        run: |
          tag=${GITHUB_REF_NAME#v}
          crate=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          [ "$tag" = "$crate" ] \
            || { echo "::error::tag $tag != Cargo.toml $crate"; exit 1; }

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME" \
            --generate-notes \
            target/wasm32-wasip1/release/zj-agent-mob.wasm
