name: CI

on:
  pull_request:
  push:
    branches: [main]

# A force-push to a PR should cancel the previous run rather than queue behind it.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  rust:
    name: fmt, clippy, test, wasm build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt,clippy
          rustup target add wasm32-wasip1

      - uses: Swatinem/rust-cache@v2

      - run: cargo fmt --all --check

      - run: cargo clippy --all-targets -- -D warnings

      # tests/hook_e2e.rs drives the real hook script, which shells out to jq.
      - name: Install jq (the hook depends on it)
        run: sudo apt-get update && sudo apt-get install -y jq

      # Tests run natively: host calls are stubbed off-wasm precisely so this works.
      - run: cargo test --all-targets

      - run: cargo build --release --target wasm32-wasip1

      # Zellij's loader needs the WASI `_start` export, which only a bin target
      # provides. A cdylib-only build fails at load with "could not find
      # exported function", which no other check here would catch.
      - name: Verify the wasm exports Zellij needs
        run: |
          sudo apt-get update && sudo apt-get install -y wabt
          exports=$(wasm-objdump -x target/wasm32-wasip1/release/zj-agent-mob.wasm)
          for sym in _start load update render pipe plugin_version; do
            printf '%s' "$exports" | grep -q "<$sym> -> \"$sym\"" \
              || { echo "::error::wasm is missing the $sym export"; exit 1; }
          done
          echo "all required exports present"

  shell:
    name: shellcheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: shellcheck
        run: |
          sudo apt-get update && sudo apt-get install -y shellcheck
          shellcheck --shell=sh init.sh scripts/zj-agent-mob-hook.sh \
            scripts/check.sh scripts/reinstall-local.sh tests/e2e-install.sh

      # The hook end-to-end tests live in tests/hook_e2e.rs and run under
      # `cargo test` in the rust job above.

      # The installer is the only supported path to a working install, and what
      # it writes is read by Claude Code and Codex themselves: a wrong event
      # name or matcher silences every agent and no Rust test would notice.
      - name: Installer end-to-end tests
        run: ./tests/e2e-install.sh
