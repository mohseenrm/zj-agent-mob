name: CI

# Every check runs through `scripts/check.sh <step>`, so the commands live in
# one place and cannot drift from the local pre-push loop. The steps stay
# separate here to keep GitHub's per-step log sections and the two parallel jobs.

on:
  pull_request:
  push:
    branches: [main]

# A force-push to a PR should cancel the previous run rather than queue behind it.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  rust:
    name: fmt, clippy, test, wasm build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt,clippy
          rustup target add wasm32-wasip1

      - uses: Swatinem/rust-cache@v2

      # tests/hook_e2e.rs drives the real hook script, which shells out to jq;
      # wabt provides the wasm-objdump the exports check needs.
      - name: Install jq and wabt
        run: sudo apt-get update && sudo apt-get install -y jq wabt

      - run: ./scripts/check.sh fmt

      - run: ./scripts/check.sh clippy

      - run: ./scripts/check.sh test

      - run: ./scripts/check.sh wasm

      - run: ./scripts/check.sh exports

      # The only step that loads the built wasm into a real zellij. It needs the
      # wasm from the step above, so it runs in this job rather than alongside
      # shellcheck. The script skips itself if zellij is missing, so a failure
      # to install it degrades to the previous coverage rather than a red build.
      - name: Install zellij
        run: |
          curl -fsSL https://github.com/zellij-org/zellij/releases/latest/download/zellij-x86_64-unknown-linux-musl.tar.gz \
            | tar -xz -C /usr/local/bin
          zellij --version

      - run: ./scripts/check.sh panel

  shell:
    name: shellcheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install shellcheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck

      - run: ./scripts/check.sh shellcheck

      - run: ./scripts/check.sh installer
