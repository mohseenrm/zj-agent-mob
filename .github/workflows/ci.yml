name: CI

# Every check runs through `scripts/check.sh <step>`, so the commands live in
# one place and cannot drift from the local pre-push loop. The steps stay
# separate here to keep GitHub's per-step log sections and the two parallel jobs.

on:
  pull_request:
  push:
    branches: [main]

# A force-push to a PR should cancel the previous run rather than queue behind it.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  rust:
    name: fmt, clippy, test, wasm build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt,clippy
          rustup target add wasm32-wasip1

      - uses: Swatinem/rust-cache@v2

      # tests/hook_e2e.rs drives the real hook script, which shells out to jq;
      # wabt provides the wasm-objdump the exports check needs.
      - name: Install jq and wabt
        run: sudo apt-get update && sudo apt-get install -y jq wabt

      - run: ./scripts/check.sh fmt

      - run: ./scripts/check.sh clippy

      - run: ./scripts/check.sh test

      - run: ./scripts/check.sh wasm

      - run: ./scripts/check.sh exports

  shell:
    name: shellcheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install shellcheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck

      - run: ./scripts/check.sh shellcheck

      - run: ./scripts/check.sh installer
